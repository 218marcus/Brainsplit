<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Brainsplit</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; user-select:none; }
body {
    background: #0b0b16;
    font-family: 'Segoe UI','PingFang TC','Microsoft YaHei',sans-serif;
    display:flex; justify-content:center; align-items:center;
    min-height:100vh; color:#e8e8f0; padding:6px;
    touch-action: none;
}
.game-container {
    width:100%; max-width:900px;
    background:#12121f; border-radius:20px;
    padding:12px; box-shadow:0 12px 40px rgba(0,0,0,0.8);
    border:1px solid #2a2a44;
}
.header {
    display:flex; justify-content:space-between; align-items:center;
    padding-bottom:8px; border-bottom:1px solid #2a2a44;
    margin-bottom:10px; flex-wrap:wrap; gap:4px 8px;
}
.title {
    display:flex; align-items:center; gap:10px;
}
.logo-wrapper {
    width:36px; height:36px;
    position:relative;
    flex-shrink:0;
}
.logo-brain {
    width:100%; height:100%;
    border-radius:50%;
    background: linear-gradient(to right, #6366f1 50%, #8b5cf6 50%);
    position:relative;
    overflow:hidden;
    box-shadow: 0 0 20px rgba(99,102,241,0.3);
}
.logo-brain::after {
    content:'';
    position:absolute;
    left:50%; top:0;
    width:2px; height:100%;
    background:#fff;
    transform:translateX(-50%);
    box-shadow: 0 0 8px rgba(255,255,255,0.4);
}
.logo-brain .lightning {
    position:absolute;
    top:50%; left:50%;
    transform:translate(-50%,-50%);
    font-size:18px;
    color:#fff;
    text-shadow:0 0 12px rgba(255,255,255,0.6);
    line-height:1;
}
.brand {
    font-size:22px; font-weight:700; letter-spacing:1px;
    background:linear-gradient(135deg,#a78bfa,#60a5fa,#34d399);
    -webkit-background-clip:text; -webkit-text-fill-color:transparent;
    background-clip:text;
}
.title-score { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.score-display {
    font-size:16px; font-weight:600; background:#1c1c32;
    padding:4px 14px; border-radius:30px; border:1px solid #3a3a5a;
}
.score-display span { color:#fcd34d; font-size:18px; min-width:40px; display:inline-block; text-align:center; }
.btn-group { display:flex; gap:6px; }
.btn {
    padding:4px 14px; border:none; border-radius:30px; font-size:13px;
    font-weight:600; cursor:pointer; background:#2a2a4a; color:#b0b0d0;
    border:1px solid #3a3a5a; touch-action: manipulation;
}
.btn-primary { background:linear-gradient(135deg,#6366f1,#8b5cf6); color:#fff; border:none; }
.btn-danger { background:linear-gradient(135deg,#ef4444,#dc2626); color:#fff; border:none; }
.btn:disabled { opacity:0.35; cursor:not-allowed; }

.game-body {
    display:flex; gap:6px; min-height:380px; position:relative;
    flex-direction:row !important;
}
.left-panel {
    flex:1 1 0; min-width:0;
    padding:8px 6px 6px;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:#141425; border-radius:16px;
    border:1px solid #22223e; position:relative;
}
.right-panel {
    flex:1 1 0; min-width:0;
    padding:8px 6px 6px;
    display:flex; flex-direction:column;
    background:#141425; border-radius:16px;
    border:1px solid #22223e; position:relative;
}
.panel-label {
    position:absolute; top:4px; left:10px;
    font-size:10px; font-weight:600; color:#6b6b9a;
    background:#1a1a30; padding:1px 10px; border-radius:12px;
    border:1px solid #2a2a4e;
}
.status-badge {
    position:absolute; top:4px; right:10px;
    font-size:9px; font-weight:600; padding:1px 10px;
    border-radius:12px; background:#1e1e3a;
    border:1px solid #333358; color:#6b6b9a;
}
.status-badge.playing { color:#34d399; border-color:#34d399; background:#0f2a1e; }
.status-badge.gameover { color:#f87171; border-color:#f87171; background:#2a1212; }
.status-badge.event { color:#fbbf24; border-color:#fbbf24; background:#2a2812; }

.stroop-prompt {
    font-size:12px; font-weight:500; color:#c4c4e6;
    background:#1e1e38; padding:4px 12px; border-radius:20px;
    margin-bottom:4px; border:1px solid #333358;
    min-height:30px; display:flex; align-items:center; justify-content:center;
    text-align:center; width:100%;
}
.stroop-prompt .highlight { color:#fcd34d; font-weight:700; }
.stroop-word {
    font-size:42px; font-weight:800; line-height:1.1;
    margin-bottom:6px; text-shadow:0 0 30px rgba(255,255,255,0.04);
    letter-spacing:2px; min-height:60px;
    display:flex; align-items:center; justify-content:center;
    padding:0 4px; width:100%;
}
.stroop-options { display:flex; gap:14px; margin-top:4px; flex-wrap:wrap; justify-content:center; width:100%; }
.option-btn {
    flex:1; min-width:60px; max-width:100px;
    padding:10px 0; border:2px solid #3a3a5e;
    border-radius:12px; background:#1a1a32; color:#e0e0f0;
    font-size:16px; font-weight:700; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; gap:1px;
    font-family:inherit; touch-action: manipulation;
}
.option-btn .key-hint { font-size:10px; font-weight:400; color:#6b6b9a; background:#252545; padding:0 8px; border-radius:10px; line-height:18px; }
.option-btn:active:not(:disabled) { transform:scale(0.95); background:#2a2a4a; }
.option-btn.correct { border-color:#34d399; background:#1a3a2e; }
.option-btn.wrong { border-color:#f87171; background:#3a1a1a; }
.option-btn:disabled { cursor:not-allowed; opacity:0.5; }

#gameCanvas {
    width:100%; height:100%; border-radius:12px;
    background:#0e0e1e; display:block; flex:1;
    min-height:200px; border:1px solid #22223e;
    touch-action: none;
}
.mobile-touch-hint {
    position:absolute; bottom:4px; left:50%; transform:translateX(-50%);
    font-size:9px; color:#6b6b9a; background:rgba(20,20,37,0.7);
    padding:2px 12px; border-radius:12px;
    border:1px solid #2a2a4e; pointer-events:none; white-space:nowrap;
}

.divider {
    width:2px; background:linear-gradient(to bottom, transparent,#6366f1,#8b5cf6,#a78bfa,transparent);
    flex-shrink:0; border-radius:4px; margin:0 2px;
}
.divider::after {
    content:'⚡'; position:absolute; top:50%; left:50%;
    transform:translate(-50%,-50%); font-size:14px;
    color:#a78bfa; text-shadow:0 0 20px rgba(167,139,250,0.5);
    background:#12121f; padding:2px 2px; border-radius:50%;
}

.gameover-overlay {
    position:absolute; inset:0;
    background:rgba(0,0,0,0.8); backdrop-filter:blur(4px);
    border-radius:16px; display:none;
    flex-direction:column; align-items:center; justify-content:center;
    z-index:20; padding:16px; border:1px solid rgba(239,68,68,0.2);
}
.gameover-overlay.show { display:flex; }
.gameover-title { font-size:28px; font-weight:800; color:#f87171; text-shadow:0 0 40px rgba(239,68,68,0.3); letter-spacing:2px; margin-bottom:4px; }
.gameover-sub { font-size:14px; color:#b0b0d0; margin-bottom:4px; }
.gameover-score { font-size:22px; font-weight:700; color:#fcd34d; margin-bottom:10px; }
.gameover-score span { font-size:30px; }
.gameover-btn {
    padding:8px 28px; border:none; border-radius:30px;
    font-size:16px; font-weight:700;
    background:linear-gradient(135deg,#8b5cf6,#6366f1); color:#fff;
    cursor:pointer; touch-action: manipulation;
}

.timer-display {
    font-size:14px; font-weight:600; color:#fcd34d;
    background:#1e1e38; padding:2px 14px; border-radius:20px;
    border:1px solid #333358; margin-bottom:6px;
}
.timer-display.warning { color:#f87171; border-color:#f87171; }

.event-overlay {
    position:absolute;
    top:0; left:0; width:100%; height:100%;
    background:rgba(0,0,0,0.7);
    backdrop-filter:blur(6px);
    display:none;
    align-items:center; justify-content:center;
    flex-direction:column;
    z-index:30;
    border-radius:16px;
    pointer-events:none;
}
.event-overlay.show { display:flex; }
.event-title {
    font-size:32px; font-weight:800;
    background:linear-gradient(135deg,#fbbf24,#f59e0b);
    -webkit-background-clip:text; -webkit-text-fill-color:transparent;
    background-clip:text;
    text-shadow:0 0 40px rgba(251,191,36,0.3);
    animation:pulse 0.8s ease-in-out infinite alternate;
}
.event-sub {
    font-size:18px; color:#e8e8f0; margin-top:8px;
}
@keyframes pulse {
    0% { transform:scale(1); opacity:0.8; }
    100% { transform:scale(1.05); opacity:1; }
}

@media (max-width: 560px) {
    .game-container { padding:6px; border-radius:14px; }
    .brand { font-size:18px; }
    .logo-wrapper { width:28px; height:28px; }
    .logo-brain .lightning { font-size:14px; }
    .score-display { font-size:13px; padding:2px 10px; }
    .score-display span { font-size:14px; min-width:30px; }
    .btn { font-size:11px; padding:3px 10px; }
    .game-body { min-height:300px; gap:4px; }
    .left-panel, .right-panel { padding:4px; border-radius:12px; }
    .panel-label { font-size:8px; top:2px; left:6px; padding:0 8px; }
    .status-badge { font-size:8px; top:2px; right:6px; padding:0 8px; }
    .stroop-prompt { font-size:10px; padding:2px 8px; min-height:24px; margin-bottom:4px; }
    .stroop-word { font-size:28px; min-height:40px; margin-bottom:4px; }
    .stroop-options { gap:8px; }
    .option-btn { min-width:50px; max-width:70px; padding:6px 0; font-size:13px; border-radius:10px; }
    .option-btn .key-hint { font-size:8px; line-height:14px; padding:0 6px; }
    #gameCanvas { min-height:140px; border-radius:8px; }
    .mobile-touch-hint { font-size:7px; padding:1px 8px; }
    .divider { width:2px; }
    .divider::after { font-size:10px; }
    .gameover-title { font-size:20px; }
    .gameover-score { font-size:18px; }
    .gameover-score span { font-size:24px; }
    .gameover-btn { font-size:14px; padding:6px 20px; }
    .timer-display { font-size:12px; padding:1px 10px; }
    .event-title { font-size:24px; }
    .event-sub { font-size:14px; }
}
@media (max-width: 400px) {
    .stroop-word { font-size:22px; min-height:34px; }
    .option-btn { min-width:40px; max-width:60px; padding:4px 0; font-size:11px; }
    #gameCanvas { min-height:100px; }
}
</style>
</head>
<body>
<div class="game-container">
    <div class="header">
        <div class="title">
            <div class="logo-wrapper">
                <div class="logo-brain">
                    <span class="lightning">⚡</span>
                </div>
            </div>
            <span class="brand">Brainsplit</span>
        </div>
        <div class="title-score">
            <div class="score-display">🏆 <span id="scoreDisplay">0</span></div>
            <div class="btn-group">
                <button class="btn btn-primary" id="btnStart">▶ 開始</button>
                <button class="btn btn-danger" id="btnReset">⟳</button>
            </div>
        </div>
    </div>
    <div class="game-body">
        <div class="left-panel">
            <div class="panel-label" id="leftLabel">🧩 邏輯</div>
            <div class="status-badge" id="statusBadge">⏸</div>
            <div class="stroop-prompt" id="stroopPrompt">按 <span class="highlight">開始</span></div>
            <div class="timer-display" id="timerDisplay">⏱ 5s</div>
            <div class="stroop-word" id="stroopWord">——</div>
            <div class="stroop-options">
                <button class="option-btn" id="optA" disabled>
                    <span class="key-hint">[A]</span>
                    <span id="optALabel">—</span>
                </button>
                <button class="option-btn" id="optS" disabled>
                    <span class="key-hint">[S]</span>
                    <span id="optSLabel">—</span>
                </button>
            </div>
            <div class="gameover-overlay" id="gameoverOverlay">
                <div class="gameover-title">💀 GAME OVER</div>
                <div class="gameover-sub">左右腦失守</div>
                <div class="gameover-score">得分 <span id="finalScore">0</span></div>
                <button class="gameover-btn" id="btnGameoverRestart">🔄 再挑戰</button>
            </div>
            <div class="event-overlay" id="eventOverlay">
                <div class="event-title" id="eventTitle">⚡ 事件觸發</div>
                <div class="event-sub" id="eventSub">增加一顆球</div>
            </div>
        </div>
        <div class="divider"></div>
        <div class="right-panel">
            <div class="panel-label" id="rightLabel">🎯 物理</div>
            <div class="status-badge" id="statusBadgeRight">⏸</div>
            <canvas id="gameCanvas"></canvas>
            <div class="mobile-touch-hint" id="touchHint">👆 滑動</div>
        </div>
    </div>
</div>
<script>
(function(){
    'use strict';

    // ---------- DOM ----------
    const scoreDisplay = document.getElementById('scoreDisplay');
    const finalScore = document.getElementById('finalScore');
    const btnStart = document.getElementById('btnStart');
    const btnReset = document.getElementById('btnReset');
    const btnGameoverRestart = document.getElementById('btnGameoverRestart');
    const stroopPrompt = document.getElementById('stroopPrompt');
    const stroopWord = document.getElementById('stroopWord');
    const optA = document.getElementById('optA');
    const optS = document.getElementById('optS');
    const optALabel = document.getElementById('optALabel');
    const optSLabel = document.getElementById('optSLabel');
    const statusBadge = document.getElementById('statusBadge');
    const statusBadgeRight = document.getElementById('statusBadgeRight');
    const gameoverOverlay = document.getElementById('gameoverOverlay');
    const touchHint = document.getElementById('touchHint');
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const timerDisplay = document.getElementById('timerDisplay');
    const eventOverlay = document.getElementById('eventOverlay');
    const eventTitle = document.getElementById('eventTitle');
    const eventSub = document.getElementById('eventSub');
    const leftLabel = document.getElementById('leftLabel');
    const rightLabel = document.getElementById('rightLabel');

    // ---------- 顏色 ----------
    const COLOR_MAP = {
        '紅色':'#ff1744','藍色':'#2979ff','綠色':'#00e676','黃色':'#ffea00',
        '紫色':'#d500f9','橙色':'#ff9100','粉色':'#f50057','青色':'#00bcd4',
        '棕色':'#8d6e63','灰色':'#bdbdbd'
    };
    const COLOR_NAMES = Object.keys(COLOR_MAP);

    // ---------- 狀態 ----------
    const STATE = { IDLE:'idle', PLAYING:'playing', GAMEOVER:'gameover' };
    let gameState = STATE.IDLE;
    let score = 0;
    let timerInterval = null;
    let animFrameId = null;
    let stroopData = null;
    let stroopLocked = false;

    // ---------- 左腦計時器 ----------
    let leftTimer = 0;
    const LEFT_TIME_LIMIT = 5;
    let lastTimestamp = 0;

    // ---------- 事件系統 ----------
    let maxBalls = 3;
    let isControlSwapped = false;
    let isGravityReversed = false;
    let activeEvent = null; // 'swap', 'number', 'gravity', null
    let eventTimer = 0;
    let isNumberSort = false;
    let numberSortCorrectSide = 0;
    let numberSortNum1 = 0, numberSortNum2 = 0;
    let numberSortType = 'larger'; // 'larger' 或 'smaller'
    let lastEventScore = 0;
    const EVENT_INTERVAL = 500;
    let eventTriggered = false;

    // ---------- 物理參數 ----------
    let balls = [];
    let paddle = { x:0, y:0, w:80, h:14 };
    let canvasW = 0, canvasH = 0;
    let ballSpawnTimer = 0;
    const BALL_RADIUS = 10;
    const PADDLE_SPEED = 6;
    let gravity = 0.06;

    const BASE_SPEED = 1.2;
    const BASE_INTERVAL = 110;
    const SPEED_INCREMENT = 0.1;
    const INCREMENT_STEP = 300;
    const MAX_SPEED = 2.5;
    const MIN_INTERVAL = 60;
    const INTERVAL_REDUCTION = 2;

    const keys = { left:false, right:false };
    let keysA = false, keysS = false;

    function randomItem(arr) { return arr[Math.floor(Math.random()*arr.length)]; }
    function randomInt(min,max) { return Math.floor(Math.random()*(max-min+1))+min; }
    function shuffleArray(arr) {
        for(let i=arr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; }
        return arr;
    }

    function roundRect(ctx, x, y, w, h, r) {
        if (r > w/2) r = w/2;
        if (r > h/2) r = h/2;
        ctx.moveTo(x+r, y);
        ctx.arcTo(x+w, y, x+w, y+h, r);
        ctx.arcTo(x+w, y+h, x, y+h, r);
        ctx.arcTo(x, y+h, x, y, r);
        ctx.arcTo(x, y, x+w, y, r);
        return ctx;
    }

    // ---------- Stroop ----------
    function generateStroopQuestion() {
        const word = randomItem(COLOR_NAMES);
        let displayColorName;
        if (Math.random() < 0.3) displayColorName = word;
        else {
            const others = COLOR_NAMES.filter(c=>c!==word);
            displayColorName = randomItem(others);
        }
        const displayColorHex = COLOR_MAP[displayColorName];
        const task = Math.random() < 0.5 ? 'color' : 'meaning';
        const correctAnswer = (task === 'color') ? displayColorName : word;
        let distractor;
        const candidates = COLOR_NAMES.filter(c=>c!==correctAnswer);
        distractor = randomItem(candidates);
        const options = shuffleArray([correctAnswer, distractor]);
        return { word, displayColor:displayColorHex, displayColorName, task, correctAnswer, options };
    }

    function renderStroop() {
        if (isNumberSort) {
            const hint = numberSortType === 'larger' ? '較大' : '較小';
            stroopPrompt.innerHTML = `🔢 選擇<span class="highlight">${hint}</span>的數字 (${Math.ceil(eventTimer)}s)`;
            stroopWord.textContent = `${numberSortNum1}  vs  ${numberSortNum2}`;
            optALabel.textContent = numberSortNum1;
            optSLabel.textContent = numberSortNum2;
            optA.disabled = false;
            optS.disabled = false;
            optA.className = 'option-btn';
            optS.className = 'option-btn';
            return;
        }
        if (!stroopData) {
            stroopPrompt.innerHTML = '按 <span class="highlight">開始</span>';
            stroopWord.textContent = '——';
            stroopWord.style.color = '#555';
            optALabel.textContent = '—';
            optSLabel.textContent = '—';
            optA.disabled = true;
            optS.disabled = true;
            timerDisplay.textContent = '⏱ --';
            timerDisplay.className = 'timer-display';
            return;
        }
        const d = stroopData;
        const taskLabel = d.task === 'color' ? '點顏色' : '點意思';
        stroopPrompt.innerHTML = `🎯 <span class="highlight">${taskLabel}</span>`;
        stroopWord.textContent = d.word;
        stroopWord.style.color = d.displayColor;
        optALabel.textContent = d.options[0];
        optSLabel.textContent = d.options[1];
        optA.disabled = false;
        optS.disabled = false;
        optA.className = 'option-btn';
        optS.className = 'option-btn';
        leftTimer = LEFT_TIME_LIMIT;
        updateTimerDisplay();
    }

    function refreshStroop() {
        if (gameState !== STATE.PLAYING) return;
        if (isNumberSort) return;
        stroopData = generateStroopQuestion();
        stroopLocked = false;
        renderStroop();
    }

    function handleStroopAnswer(selectedIdx) {
        if (gameState !== STATE.PLAYING || stroopLocked) return;
        if (isNumberSort) {
            const isCorrect = (selectedIdx === numberSortCorrectSide);
            stroopLocked = true;
            optA.disabled = true;
            optS.disabled = true;
            if (isCorrect) {
                score += 50;
                updateScore();
                endNumberSort(true);
            } else {
                triggerGameOver();
            }
            return;
        }
        if (!stroopData) return;
        const d = stroopData;
        const selected = d.options[selectedIdx];
        const isCorrect = (selected === d.correctAnswer);
        stroopLocked = true;
        optA.disabled = true;
        optS.disabled = true;
        const btn = selectedIdx===0 ? optA : optS;
        if (isCorrect) {
            btn.classList.add('correct');
            score += 50;
            updateScore();
            setTimeout(()=>{
                if (gameState === STATE.PLAYING) refreshStroop();
                else { stroopLocked=false; renderStroop(); }
            }, 250);
        } else {
            btn.classList.add('wrong');
            setTimeout(()=>{ triggerGameOver(); }, 300);
        }
    }

    function updateTimerDisplay() {
        const secs = Math.ceil(leftTimer);
        timerDisplay.textContent = `⏱ ${secs}s`;
        timerDisplay.className = secs <= 1 ? 'timer-display warning' : 'timer-display';
    }

    // ---------- 數字排序事件 ----------
    function startNumberSort() {
        let n1, n2;
        do {
            n1 = randomInt(1, 50);
            n2 = randomInt(1, 50);
        } while (n1 === n2);
        // 隨機決定選較大或較小
        const chooseLarger = Math.random() < 0.5;
        let correctSide;
        if (chooseLarger) {
            correctSide = (n1 > n2) ? 0 : 1;
        } else {
            correctSide = (n1 < n2) ? 0 : 1;
        }
        numberSortNum1 = n1;
        numberSortNum2 = n2;
        numberSortCorrectSide = correctSide;
        numberSortType = chooseLarger ? 'larger' : 'smaller';
        isNumberSort = true;
        stroopLocked = false;
        eventTimer = 5; // 5秒限時
        renderStroop();
        statusBadge.textContent = '🔢';
        statusBadge.className = 'status-badge event';
        leftLabel.textContent = '🔢 數字排序';
    }

    function endNumberSort(success) {
        isNumberSort = false;
        activeEvent = null;
        eventTimer = 0;
        statusBadge.textContent = '▶';
        statusBadge.className = 'status-badge playing';
        leftLabel.textContent = '🧩 邏輯';
        if (success) {
            stroopData = null;
            refreshStroop();
        } else {
            triggerGameOver();
        }
    }

    // ---------- 事件觸發 ----------
    function triggerRandomEvent() {
        if (gameState !== STATE.PLAYING) return;
        // 先結束舊的持續事件
        if (activeEvent === 'swap') {
            isControlSwapped = false;
            activeEvent = null;
            statusBadge.textContent = '▶';
            statusBadge.className = 'status-badge playing';
            leftLabel.textContent = '🧩 邏輯';
            rightLabel.textContent = '🎯 物理';
        }
        if (activeEvent === 'gravity') {
            isGravityReversed = false;
            gravity = 0.06;
            activeEvent = null;
            statusBadgeRight.textContent = '▶';
            statusBadgeRight.className = 'status-badge playing';
            paddle.y = canvasH - paddle.h - 12; // 恢復位置
        }
        if (activeEvent === 'number') {
            if (isNumberSort) {
                endNumberSort(false);
                return; // 如果導致 Game Over，則結束
            }
        }

        const eventType = randomInt(1, 4);
        let eventName = '', eventDesc = '';

        switch(eventType) {
            case 1:
                maxBalls = Math.min(6, maxBalls + 1);
                eventName = '⚡ 增加球';
                eventDesc = `最大球數 +1 (目前 ${maxBalls})`;
                showEventOverlay(eventName, eventDesc);
                break;
            case 2:
                isControlSwapped = true;
                activeEvent = 'swap';
                eventName = '🔄 交換操控';
                eventDesc = '左右腦操控互換！';
                showEventOverlay(eventName, eventDesc);
                statusBadge.textContent = '🔄';
                statusBadge.className = 'status-badge event';
                leftLabel.textContent = '🎯 物理 (操控)';
                rightLabel.textContent = '🧩 邏輯 (操控)';
                break;
            case 3:
                activeEvent = 'number';
                eventName = '🔢 數字排序';
                eventDesc = '選擇較大/較小的數字 (5秒)';
                showEventOverlay(eventName, eventDesc);
                startNumberSort();
                break;
            case 4:
                isGravityReversed = true;
                gravity = 0.06;
                activeEvent = 'gravity';
                eventName = '🌀 重力反轉';
                eventDesc = '擋板移至頂部！';
                showEventOverlay(eventName, eventDesc);
                statusBadgeRight.textContent = '🌀';
                statusBadgeRight.className = 'status-badge event';
                paddle.y = 10;
                break;
        }
        lastEventScore = Math.floor(score / EVENT_INTERVAL) * EVENT_INTERVAL;
    }

    function showEventOverlay(title, sub) {
        eventTitle.textContent = title;
        eventSub.textContent = sub;
        eventOverlay.classList.add('show');
        setTimeout(() => {
            eventOverlay.classList.remove('show');
        }, 1500);
    }

    // ---------- Canvas ----------
    function initCanvas() {
        const rect = canvas.getBoundingClientRect();
        const dpr = window.devicePixelRatio || 1;
        canvasW = canvas.clientWidth || rect.width || 300;
        canvasH = canvas.clientHeight || rect.height || 200;
        canvas.width = canvasW * dpr;
        canvas.height = canvasH * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        let newW = canvasW * 0.25;
        newW = Math.min(140, Math.max(50, newW));
        paddle.w = newW;
        paddle.x = (canvasW - paddle.w) / 2;
        paddle.y = isGravityReversed ? 10 : canvasH - paddle.h - 12;
    }

    function resetPhysics() {
        balls = [];
        ballSpawnTimer = 0;
        paddle.x = (canvasW - paddle.w) / 2;
        paddle.y = isGravityReversed ? 10 : canvasH - paddle.h - 12;
        isControlSwapped = false;
        isGravityReversed = false;
        gravity = 0.06;
        activeEvent = null;
        isNumberSort = false;
        maxBalls = 3;
        lastEventScore = 0;
        eventTriggered = false;
        statusBadge.textContent = '⏸';
        statusBadge.className = 'status-badge';
        statusBadgeRight.textContent = '⏸';
        statusBadgeRight.className = 'status-badge';
        leftLabel.textContent = '🧩 邏輯';
        rightLabel.textContent = '🎯 物理';
        if (isNumberSort) endNumberSort(false);
    }

    function spawnBall() {
        if (balls.length >= maxBalls) return;
        const x = randomInt(16+BALL_RADIUS, canvasW-16-BALL_RADIUS);
        const y = isGravityReversed ? canvasH - BALL_RADIUS - randomInt(0,20) : -BALL_RADIUS - randomInt(0,16);
        const vx = (Math.random()-0.5)*0.6;
        const speedBonus = Math.floor(score / INCREMENT_STEP) * SPEED_INCREMENT;
        const currentSpeed = Math.min(MAX_SPEED, BASE_SPEED + speedBonus);
        const vy = isGravityReversed ? -(currentSpeed + (Math.random() - 0.5) * 0.2) : (currentSpeed + (Math.random() - 0.5) * 0.2);
        const color = randomItem(COLOR_NAMES);
        balls.push({ x, y, vx, vy, radius: BALL_RADIUS, color: COLOR_MAP[color] });
    }

    function updatePhysics() {
        if (gameState !== STATE.PLAYING) return;

        // 交換控制
        if (isControlSwapped) {
            if (keys.left) { if (!optA.disabled) handleStroopAnswer(0); keys.left = false; }
            if (keys.right) { if (!optS.disabled) handleStroopAnswer(1); keys.right = false; }
            if (keysA) paddle.x = Math.max(0, paddle.x - PADDLE_SPEED);
            if (keysS) paddle.x = Math.min(canvasW - paddle.w, paddle.x + PADDLE_SPEED);
        } else {
            if (keys.left) paddle.x = Math.max(0, paddle.x - PADDLE_SPEED);
            if (keys.right) paddle.x = Math.min(canvasW - paddle.w, paddle.x + PADDLE_SPEED);
        }

        // 擋板位置
        if (isGravityReversed) paddle.y = 10;
        else paddle.y = canvasH - paddle.h - 12;

        // 生成球
        ballSpawnTimer++;
        const intervalReduction = Math.floor(score / INCREMENT_STEP) * INTERVAL_REDUCTION;
        let currentInterval = Math.max(MIN_INTERVAL, BASE_INTERVAL - intervalReduction);
        if (ballSpawnTimer >= currentInterval) {
            ballSpawnTimer = 0;
            spawnBall();
        }

        // 更新球
        for (let i=balls.length-1; i>=0; i--) {
            const b = balls[i];
            b.vy += isGravityReversed ? -gravity : gravity;
            b.x += b.vx;
            b.y += b.vy;

            if (b.x - b.radius < 0) { b.x = b.radius; b.vx = -b.vx; }
            if (b.x + b.radius > canvasW) { b.x = canvasW - b.radius; b.vx = -b.vx; }

            const px=paddle.x, py=paddle.y, pw=paddle.w, ph=paddle.h;
            if (isGravityReversed) {
                if (b.y - b.radius <= py + ph && b.y - b.radius >= py - 5) {
                    if (b.x >= px - b.radius + 3 && b.x <= px + pw + b.radius - 3) {
                        b.vy = Math.abs(b.vy) + 0.5;
                        b.y = py + ph + b.radius + 0.5;
                        score += 10;
                        updateScore();
                        b.vx += (Math.random()-0.5)*0.4;
                        const maxV=5;
                        if (Math.abs(b.vx)>maxV) b.vx = Math.sign(b.vx)*maxV;
                        if (Math.abs(b.vy)>maxV) b.vy = Math.sign(b.vy)*maxV;
                        continue;
                    }
                }
                if (b.y - b.radius > canvasH) {
                    triggerGameOver();
                    return;
                }
            } else {
                if (b.y + b.radius >= py && b.y + b.radius <= py + ph + 6) {
                    if (b.x >= px - b.radius + 3 && b.x <= px + pw + b.radius - 3) {
                        b.vy = -Math.abs(b.vy) - 0.5;
                        b.y = py - b.radius - 0.5;
                        score += 10;
                        updateScore();
                        b.vx += (Math.random()-0.5)*0.4;
                        const maxV=5;
                        if (Math.abs(b.vx)>maxV) b.vx = Math.sign(b.vx)*maxV;
                        if (Math.abs(b.vy)>maxV) b.vy = Math.sign(b.vy)*maxV;
                        continue;
                    }
                }
                if (b.y + b.radius > canvasH) {
                    triggerGameOver();
                    return;
                }
            }
        }
        balls = balls.filter(b => b.y < canvasH + 100 && b.y > -100);
    }

    function renderPhysics() {
        const dpr = window.devicePixelRatio || 1;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.clearRect(0, 0, canvasW, canvasH);

        ctx.strokeStyle='rgba(255,255,255,0.03)';
        ctx.lineWidth=1;
        for(let i=0;i<canvasW;i+=20){ ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i,canvasH); ctx.stroke(); }
        for(let i=0;i<canvasH;i+=20){ ctx.beginPath(); ctx.moveTo(0,i); ctx.lineTo(canvasW,i); ctx.stroke(); }

        for(const b of balls) {
            const grad = ctx.createRadialGradient(b.x-3,b.y-3,2,b.x,b.y,b.radius);
            grad.addColorStop(0, lightenColor(b.color,50));
            grad.addColorStop(1, b.color);
            ctx.shadowColor = b.color;
            ctx.shadowBlur = 16;
            ctx.beginPath(); ctx.arc(b.x,b.y,b.radius,0,Math.PI*2);
            ctx.fillStyle = grad;
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.beginPath(); ctx.arc(b.x-3,b.y-4,3,0,Math.PI*2);
            ctx.fillStyle='rgba(255,255,255,0.2)';
            ctx.fill();
        }
        ctx.shadowBlur=0;

        const gradP = ctx.createLinearGradient(paddle.x,paddle.y,paddle.x,paddle.y+paddle.h);
        gradP.addColorStop(0,'#818cf8');
        gradP.addColorStop(1,'#6366f1');
        ctx.shadowColor='#818cf8';
        ctx.shadowBlur=24;
        ctx.beginPath();
        roundRect(ctx, paddle.x, paddle.y, paddle.w, paddle.h, 6);
        ctx.fill();
        ctx.shadowBlur=0;
        ctx.strokeStyle='rgba(255,255,255,0.12)';
        ctx.lineWidth=1;
        ctx.beginPath();
        roundRect(ctx, paddle.x, paddle.y, paddle.w, paddle.h, 6);
        ctx.stroke();
        ctx.fillStyle='rgba(255,255,255,0.06)';
        ctx.beginPath();
        roundRect(ctx, paddle.x+8, paddle.y+2, paddle.w-16, 3, 3);
        ctx.fill();
    }

    function lightenColor(hex, amt) {
        let r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
        r=Math.min(255,r+amt); g=Math.min(255,g+amt); b=Math.min(255,b+amt);
        return `#${r.toString(16).padStart(2,'0')}${g.toString(16).padStart(2,'0')}${b.toString(16).padStart(2,'0')}`;
    }

    // ---------- 分數 ----------
    function updateScore() {
        scoreDisplay.textContent = Math.floor(score);
        const currentEventLevel = Math.floor(score / EVENT_INTERVAL);
        if (currentEventLevel > 0 && currentEventLevel > Math.floor(lastEventScore / EVENT_INTERVAL)) {
            triggerRandomEvent();
        }
    }

    // ---------- 遊戲迴圈 ----------
    function gameLoop(timestamp) {
        if (!lastTimestamp) lastTimestamp = timestamp;
        const delta = (timestamp - lastTimestamp) / 1000;
        lastTimestamp = timestamp;

        if (gameState === STATE.PLAYING) {
            // 普通左腦計時
            if (!isNumberSort && stroopData && !stroopLocked) {
                leftTimer -= delta;
                if (leftTimer <= 0) {
                    leftTimer = 0;
                    updateTimerDisplay();
                    triggerGameOver();
                } else {
                    updateTimerDisplay();
                }
            }
            // 數字題計時
            if (isNumberSort) {
                eventTimer -= delta;
                if (eventTimer <= 0) {
                    eventTimer = 0;
                    endNumberSort(false);
                    if (gameState === STATE.PLAYING) {
                        triggerGameOver();
                    }
                } else {
                    // 更新顯示倒數
                    const hint = numberSortType === 'larger' ? '較大' : '較小';
                    stroopPrompt.innerHTML = `🔢 選擇<span class="highlight">${hint}</span>的數字 (${Math.ceil(eventTimer)}s)`;
                }
            }
            updatePhysics();
            renderPhysics();
        } else if (gameState === STATE.IDLE) {
            renderPhysics();
        }
        animFrameId = requestAnimationFrame(gameLoop);
    }

    // ---------- 開始遊戲 ----------
    function startGame() {
        try {
            if(timerInterval) clearInterval(timerInterval);
            timerInterval = null;
            score = 0;
            updateScore();
            resetPhysics();
            gameoverOverlay.classList.remove('show');
            stroopData = null;
            stroopLocked = false;
            stroopPrompt.innerHTML = '🧠 準備中...';
            stroopWord.textContent = '——';
            stroopWord.style.color = '#555';
            optALabel.textContent = '—';
            optSLabel.textContent = '—';
            optA.disabled = true;
            optS.disabled = true;
            optA.className = 'option-btn';
            optS.className = 'option-btn';
            leftTimer = LEFT_TIME_LIMIT;
            updateTimerDisplay();
            gameState = STATE.PLAYING;
            updateUI();

            setTimeout(() => { if (gameState === STATE.PLAYING) refreshStroop(); }, 200);
            setTimeout(() => { if(gameState===STATE.PLAYING) spawnBall(); }, 300);
            ballSpawnTimer = 0;
            lastTimestamp = 0;
            lastEventScore = 0;
            eventTriggered = false;
            isControlSwapped = false;
            isGravityReversed = false;
            gravity = 0.06;
            activeEvent = null;
            isNumberSort = false;
            maxBalls = 3;
            statusBadge.textContent = '▶';
            statusBadge.className = 'status-badge playing';
            statusBadgeRight.textContent = '▶';
            statusBadgeRight.className = 'status-badge playing';
            leftLabel.textContent = '🧩 邏輯';
            rightLabel.textContent = '🎯 物理';
        } catch(e) { console.error(e); }
    }

    function triggerGameOver() {
        if (gameState === STATE.GAMEOVER) return;
        gameState = STATE.GAMEOVER;
        if(timerInterval) clearInterval(timerInterval);
        timerInterval = null;
        updateUI();
        finalScore.textContent = Math.floor(score);
        gameoverOverlay.classList.add('show');
        optA.disabled = true;
        optS.disabled = true;
        eventOverlay.classList.remove('show');
    }

    function resetToIdle() {
        if(timerInterval) clearInterval(timerInterval);
        timerInterval = null;
        if(animFrameId) { cancelAnimationFrame(animFrameId); animFrameId=null; }
        gameState = STATE.IDLE;
        score = 0;
        updateScore();
        resetPhysics();
        balls = [];
        stroopData = null;
        stroopLocked = false;
        gameoverOverlay.classList.remove('show');
        stroopPrompt.innerHTML = '按 <span class="highlight">開始</span>';
        stroopWord.textContent = '——';
        stroopWord.style.color = '#555';
        optALabel.textContent = '—';
        optSLabel.textContent = '—';
        optA.disabled = true;
        optS.disabled = true;
        optA.className = 'option-btn';
        optS.className = 'option-btn';
        leftTimer = LEFT_TIME_LIMIT;
        updateTimerDisplay();
        updateUI();
        eventOverlay.classList.remove('show');
        if(!animFrameId) animFrameId = requestAnimationFrame(gameLoop);
    }

    function updateUI() {
        const isIdle = gameState===STATE.IDLE;
        const isPlaying = gameState===STATE.PLAYING;
        const isGameover = gameState===STATE.GAMEOVER;
        btnStart.disabled = isPlaying;
        btnStart.textContent = isGameover ? '▶ 再玩' : '▶ 開始';
        if(isIdle) {
            statusBadge.textContent='⏸'; statusBadge.className='status-badge';
            statusBadgeRight.textContent='⏸'; statusBadgeRight.className='status-badge';
            touchHint.style.display='block';
        } else if(isPlaying) {
            touchHint.style.display='block';
        } else {
            statusBadge.textContent='💀'; statusBadge.className='status-badge gameover';
            statusBadgeRight.textContent='💀'; statusBadgeRight.className='status-badge gameover';
            touchHint.style.display='none';
        }
    }

    // ---------- 觸控 ----------
    function handleTouchMove(e) {
        e.preventDefault();
        if (gameState !== STATE.PLAYING) return;
        const touch = e.touches[0];
        if (!touch) return;
        const rect = canvas.getBoundingClientRect();
        const touchX = touch.clientX - rect.left;
        let newX = touchX - paddle.w / 2;
        newX = Math.max(0, Math.min(canvasW - paddle.w, newX));
        paddle.x = newX;
    }
    function handleTouchStart(e) { e.preventDefault(); if (gameState===STATE.PLAYING) handleTouchMove(e); }

    // ---------- 鍵盤 ----------
    function onKeyDown(e) {
        const key=e.key;
        if (gameState !== STATE.PLAYING) {
            if (key===' '||key==='Space'){ e.preventDefault(); if(gameState===STATE.IDLE||gameState===STATE.GAMEOVER) startGame(); }
            return;
        }
        if (key==='a'||key==='A') {
            e.preventDefault();
            if (isControlSwapped) { keysA = true; }
            else { if (!optA.disabled) handleStroopAnswer(0); }
            return;
        }
        if (key==='s'||key==='S') {
            e.preventDefault();
            if (isControlSwapped) { keysS = true; }
            else { if (!optS.disabled) handleStroopAnswer(1); }
            return;
        }
        if (key==='ArrowLeft') {
            e.preventDefault();
            if (isControlSwapped) { if (!optA.disabled) handleStroopAnswer(0); }
            else { keys.left = true; }
            return;
        }
        if (key==='ArrowRight') {
            e.preventDefault();
            if (isControlSwapped) { if (!optS.disabled) handleStroopAnswer(1); }
            else { keys.right = true; }
            return;
        }
        if (key===' '||key==='Space'){ e.preventDefault(); }
    }

    function onKeyUp(e) {
        const key=e.key;
        if (key==='ArrowLeft') { e.preventDefault(); keys.left = false; }
        if (key==='ArrowRight') { e.preventDefault(); keys.right = false; }
        if (key==='a'||key==='A') { e.preventDefault(); keysA = false; }
        if (key==='s'||key==='S') { e.preventDefault(); keysS = false; }
    }

    function resetKeys() {
        keys.left = false;
        keys.right = false;
        keysA = false;
        keysS = false;
    }

    function onResize() {
        initCanvas();
        paddle.x = Math.min(paddle.x, canvasW-paddle.w);
        paddle.y = isGravityReversed ? 10 : canvasH - paddle.h - 12;
        for(const b of balls) {
            b.x = Math.max(b.radius, Math.min(canvasW-b.radius, b.x));
            b.y = Math.min(canvasH+20, b.y);
        }
        renderPhysics();
    }

    // ---------- 初始化 ----------
    function init() {
        initCanvas();
        resetPhysics();
        gameState = STATE.IDLE;
        score = 0;
        updateScore();
        updateUI();
        gameoverOverlay.classList.remove('show');
        leftTimer = LEFT_TIME_LIMIT;
        updateTimerDisplay();

        window.addEventListener('keydown', onKeyDown);
        window.addEventListener('keyup', onKeyUp);
        window.addEventListener('resize', onResize);
        btnStart.addEventListener('click', startGame);
        btnReset.addEventListener('click', function() {
            resetKeys();
            resetToIdle();
        });
        btnGameoverRestart.addEventListener('click', startGame);

        optA.addEventListener('click', ()=>{ if(gameState===STATE.PLAYING && !optA.disabled) handleStroopAnswer(0); });
        optS.addEventListener('click', ()=>{ if(gameState===STATE.PLAYING && !optS.disabled) handleStroopAnswer(1); });
        optA.addEventListener('touchstart', function(e) {
            e.preventDefault();
            if (gameState===STATE.PLAYING && !optA.disabled) handleStroopAnswer(0);
        });
        optS.addEventListener('touchstart', function(e) {
            e.preventDefault();
            if (gameState===STATE.PLAYING && !optS.disabled) handleStroopAnswer(1);
        });

        canvas.addEventListener('touchstart', handleTouchStart, { passive:false });
        canvas.addEventListener('touchmove', handleTouchMove, { passive:false });
        canvas.addEventListener('touchend', (e)=>e.preventDefault(), { passive:false });
        canvas.addEventListener('touchcancel', (e)=>e.preventDefault(), { passive:false });

        animFrameId = requestAnimationFrame(gameLoop);
        renderStroop();
        renderPhysics();
    }

    if(document.readyState==='complete') init();
    else window.addEventListener('load', init);
})();
</script>
</body>
</html>
